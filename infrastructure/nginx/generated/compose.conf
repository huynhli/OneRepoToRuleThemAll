# Generated by scripts/generate_nginx.py. Do not edit.
resolver 127.0.0.11 valid=30s ipv6=off;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location ~* \.(?:js|mjs|css|map|json|wasm|png|jpe?g|gif|webp|ico|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ^~ /api/scholarlysources/ {
        set $portfolio_upstream scholarlysources:8000;
        rewrite ^/api/scholarlysources(/.*)$ /api$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://$portfolio_upstream$uri$is_args$args;
    }

    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":"No backend is enabled for this API path."}';
    }

    location /search/ {
        try_files $uri $uri/ /search/index.html;
    }

    location /work/ {
        try_files $uri $uri/ /search/index.html;
    }

    location = /search { return 308 /search/; }

    location = /projects/scholarlysources { return 308 /projects/scholarlysources/; }
    location /projects/scholarlysources/ {
        try_files $uri $uri/ /projects/scholarlysources/index.html;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location / { try_files $uri $uri/ /index.html; }
}
